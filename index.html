<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer-when-downgrade">

  <meta http-equiv="refresh" content="0; url=https://masondoceu.pages.dev/">

  <script>
    (() => {
      const TARGET_ORIGIN = "https://masondoceu.pages.dev";

      function buildRedirectUrl() {
        const current = new URL(window.location.href);
        const target = new URL(TARGET_ORIGIN);

        target.pathname = current.pathname;
        target.search = current.search;
        target.hash = current.hash;

        return target.toString();
      }

      window.location.replace(buildRedirectUrl());
    })();
  </script>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    a {
      color: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p>Redirecting to <a href="https://masondoceu.pages.dev/">https://masondoceu.pages.dev/</a>...</p>
  </main>
</body>
</html>
